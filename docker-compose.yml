services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-eduguard}:${POSTGRES_PASSWORD:-eduguard_secret}@db:5432/${POSTGRES_DB:-eduguard}?schema=public
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - eduguard-network

  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-eduguard}
      POSTGRES_USER: ${POSTGRES_USER:-eduguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eduguard_secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-eduguard} -d ${POSTGRES_DB:-eduguard}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - eduguard-network

volumes:
  postgres_data:

networks:
  eduguard-network:
    driver: bridge
